name: Release

on:
  push:
    branches: [main]
    paths: [package.json, package-lock.json, Dockerfile, index.js, index-cron.js, "src/**"]
  workflow_dispatch:

permissions:
  contents: read

# Two quick pushes to main would otherwise compute the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      api-version: ${{ steps.check.outputs.api-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Release when anything that goes into the image changed since the last release: code,
      # Dockerfile, package.json or runtime dependencies. Comparing against the latest tag (not
      # the push's previous commit) means changes from a failed or cancelled run still ship.
      # Dev-only dependency updates don't need a new image.
      - name: Check whether the image contents changed
        id: check
        run: |
          base=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          api='.packages["node_modules/@actual-app/api"].version'
          # Only version/integrity: npm flips fields like hasInstallScript between runs.
          runtime='.packages | with_entries(select(.key != "" and .value.dev != true) | .value |= {version, integrity})'
          echo "api-version=$(jq -r "$api" package-lock.json)" >> "$GITHUB_OUTPUT"

          changed=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            changed=true
          elif [ -z "$base" ]; then
            echo "No release tag yet"
            changed=true
          elif ! git diff --quiet "$base" HEAD -- Dockerfile package.json index.js index-cron.js src; then
            echo "Code, Dockerfile or package.json changed"
            changed=true
          elif [ "$(git show "$base:package-lock.json" | jq -S "$runtime")" != "$(jq -S "$runtime" package-lock.json)" ]; then
            echo "Runtime dependencies changed"
            changed=true
          fi
          echo "Compared against ${base:-nothing}: changed=$changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  ci:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [detect, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next patch tag
        id: tag
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "tag=v${major:-1}.${minor:-0}.$(( ${patch:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Create release
        run: >-
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
          --notes "Built with @actual-app/api $API_VERSION."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          API_VERSION: ${{ needs.detect.outputs.api-version }}

  docker:
    needs: release
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
      attestations: write
      id-token: write
